/* NEURAL NETWORK BACKGROUND */
const cvs=document.getElementById('neural-bg');
const ctx=cvs.getContext('2d');
let W,H,NODES=[];
function resize(){W=cvs.width=innerWidth;H=cvs.height=innerHeight;}
window.addEventListener('resize',resize);resize();

class Node {
  constructor() { this.reset(); }
  reset() {
    this.x=Math.random()*W;this.y=Math.random()*H;
    this.vx=(Math.random()-0.5)*0.5;this.vy=(Math.random()-0.5)*0.5;
    this.size=Math.random()*2+1;
  }
  update() {
    this.x+=this.vx;this.y+=this.vy;
    if(this.x<0||this.x>W)this.vx*=-1;
    if(this.y<0||this.y>H)this.vy*=-1;
  }
  draw() {
    ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fillStyle='#f5c542'; 
    ctx.fill();
  }
}

for(let i=0;i<80;i++) NODES.push(new Node());

function loop() {
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(245, 197, 66, 0.15)';
  ctx.lineWidth=1;
  for(let i=0;i<NODES.length;i++){
    NODES[i].update();NODES[i].draw();
    for(let j=i+1;j<NODES.length;j++){
      const dx=NODES[i].x-NODES[j].x;const dy=NODES[i].y-NODES[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<150){
        ctx.beginPath();ctx.moveTo(NODES[i].x,NODES[i].y);ctx.lineTo(NODES[j].x,NODES[j].y);ctx.stroke();
      }
    }
  }
  requestAnimationFrame(loop);
}
loop();
